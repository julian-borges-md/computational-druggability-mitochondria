metadata:
  document_id: DRUGGABILITY_REGISTRY_MITOCHONDRIAL_v1.3
  supersedes: druggability_registry_v1.2.yaml (version 1.2, 2026-09-11) and all earlier versions, which
    must not be cited
  project: Mitochondrial Druggability Assessment
  engine: DrugSynth AI
  chapter: 2B.1
  version: '1.3'
  date_created: '2026-09-30'
  author: Julian Yin Vieira Borges, MD
  orcid: 0009-0001-9929-3135
  manuscript_id: CSBR-D-26-00031
  upstream_file: pathway_registry_v1.yaml (Chapter 2A.2)
  identifier_policy: TGT_001 to TGT_025 is the single canonical identifier namespace for this manuscript
    and all its supplementary files. The MITO_TGT_NNN namespace used by target_registry.yaml, pocket_library.yaml
    and SMILES_compound_library.csv indexes a DIFFERENT 25 protein set and must never be joined on the
    numeric suffix. 24 of 25 numeric slots collide between the two namespaces.
  assessment_framework:
  - fpocket 4.0 (Le Guilloux et al. 2009), default parameters, executed 23 August 2026 and re-executed
    on corrected inputs 1 September 2026
  - RCSB Protein Data Bank human experimental structures, verified by UniProt accession
  - AlphaFold Protein Structure Database v6 where no human experimental structure exists
  - ChEMBL bioactivity data (ligand efficiency evidence)
  - Regulatory status verified against FDA, EMA and ClinicalTrials.gov, August 2026
  tools_not_executed:
  - SiteMap 3.5 (Schrodinger), no licence available; all prior SiteMap Dscore values in pocket_library.yaml
    were literature referenced estimates and have been withdrawn
  - DoGSiteScorer, not executed; claim withdrawn from Methods
  changes_from_v1_0:
  - Added executed fpocket 4.0 output for all 25 targets (previously absent).
  - Replaced every cited PDB identifier with a human structure verified by UniProt accession; 19 prior
    identifiers across 14 targets did not contain the target protein and are recorded under structural_evidence.withdrawn_pdb_citations.
  - Corrected pharmacological precedent for NDUFV1, SDHA, DNM1L, PINK1, NFE2L2 and CLPP.
  - Replaced the delivery profile summary with a mutually exclusive, exhaustive five category partition
    covering all 25 targets.
  - Added an explicit legacy identifier crosswalk to the MITO_TGT namespace.
  - Reinstated ligand_efficiency_evidence_published, which was inadvertently dropped when v1.1 was first
    assembled, and paired it with the ChEMBL derived observed value.
  changes_from_v1_1:
  - MT-ND1 fpocket output in v1.1 described the entire respiratory Complex I, not the MT-ND1 chain. An
    abandoned script wrote the full complex to the pipeline path and left fpocket running on it; the pipeline
    later overwrote the file with the correctly extracted chain but skipped re-execution because an output
    directory already existed. Reported values were 648 pockets and a 7837.219 A3 cavity. The correct
    values are 27 pockets and a 1773.902 A3 maximum pocket. Scope of the defect is MT-ND1 only; all 25
    targets were re-executed and every other target reproduces exactly.
  - 'Ligand, cofactor, metal and lipid removal before pocket detection is now disclosed, and a holo arm
    retaining them is reported alongside the apo arm for every target. The effect is bidirectional: removal
    inflates the score for SDHA by 0.244 and deflates it for TOMM40 by 0.380.'
  - TFAM reassessed on 3TMM (full protein) rather than 3FGH (HMG box 2 only). SOD2 reassessed on 1LUV
    (human wild type) rather than 9NSJ (Q143N mutant expressed in Escherichia coli). ATP5F1A reassessed
    on 8H9E chain A rather than chains A and B, which lie 58 A apart.
  - MT-CYB precedent corrected from 3 to 0 and KEAP1 from 3 to 1; both breached the rule stated in Methods
    2.4.
  - The isolation_artefact_risk field is removed. It was assigned by hand, no script produced it, and
    it did not correlate with newly exposed surface area. Three pocket selection specifications are reported
    instead.
  - 'Tier concordance recomputed on the corrected matrix: rho -0.181, p 0.387 (v1.1 reported -0.078, p
    0.711).'
  - Every correlation now carries a 95 per cent confidence interval and the panel carries a minimum detectable
    effect size.
  - 'Per target UniProt sequence coverage computed and carried: reference length from UniProt, the residue
    range the PDB entry declares, residues actually resolved in each retained chain, and the resulting
    coverage percentage. Four assessments fall below 60 per cent: LONP1 19.8 (proteolytic domain only),
    OPA1 34.4, DNM1L 46.5 and KEAP1 46.6. Three of these four carry first wave targets, so the coverage
    limitation is stated wherever the first wave is reported.'
  - The construct fragment field no longer defaults to "full construct" where the PDB entry leaves pdbx_fragment
    empty. An absent annotation is now reported as "not stated in the entry"; the coverage block carries
    the substantive answer.
  analysis_set: All 25 targets enter every reported comparison. No exclusion rule is applied. Methods
    2.2 of the first revision stated that six targets were excluded; that exclusion was never implemented
    and the statement has been withdrawn.
  revision_R2_changes:
  - Structural dimension (D1, D2) is now scored at an a priori therapeutic site, defined before pocket
    comparison and anchored on the bound cofactor/inhibitor or on UniProt active/binding residues, in
    the isolated chain and the biological assembly specifications (reviewer comments 2, 3).
  - The eight targets with no defined small-molecule site carry NA on the structural dimensions rather
    than a low score; their composite is the weight-renormalised mean over available dimensions (comment
    8).
  - D3 renamed bioactivity evidence (chemical matter abundance); it is a curated pChEMBL>=5 compound count
    and explicitly not a per-compound ligand efficiency (comments 1, 7).
  - Inference by permutation test and percentile bootstrap; Benjamini-Hochberg across a seven-test family
    (comment 5). Composite normalisation and weight robustness fully specified (comment 6).
  - Every value regenerated from a single matrix by a single statistics script and verified by an automated
    cross-document consistency check before release (comment 10).
druggability_tiers:
  tier_1:
    label: HIGH DRUGGABILITY
    criteria: Accessible binding pocket with defined geometry; ligand efficiency evidence in ChEMBL; PDB
      structure available; pharmacological precedent exists; no prohibitive delivery barrier
  tier_2:
    label: MODERATE DRUGGABILITY
    criteria: Binding site exists but is partially occluded, membrane-embedded, or lacks small molecule
      precedent; PDB structure available or homology model adequate; mitochondrial delivery feasible
  tier_3:
    label: LOW DRUGGABILITY
    criteria: Transmembrane channel or structural scaffold without defined small molecule pocket; delivery
      severely constrained; no existing pharmacological precedent
